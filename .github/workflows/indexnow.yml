name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Submit all sitemap URLs
        type: boolean
        default: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for GitHub Pages deploy
        run: sleep 120

      - name: Submit URLs to IndexNow
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            curl -s https://baripas.github.io/sitemap.xml -o sitemap.xml
            URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#<loc>##;s#</loc>##' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E '\.html$' || true)
            if [ -z "$CHANGED" ]; then echo "No HTML changes; skipping"; exit 0; fi
            URLS=$(echo "$CHANGED" | python3 -c "
import sys,json
out=[]
for line in sys.stdin:
    f=line.strip()
    if not f: continue
    if f=='index.html': out.append('https://baripas.github.io/')
    elif f.endswith('/index.html'): out.append('https://baripas.github.io/'+f[:-10])
    else: out.append('https://baripas.github.io/'+f)
print(json.dumps(out))")
          fi
          echo "Submitting: $URLS"
          curl -s -o /tmp/indexnow.out -w "indexnow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"baripas.github.io\",\"key\":\"34a24b08cb9e75f3a1932002ea10f28c\",\"keyLocation\":\"https://baripas.github.io/34a24b08cb9e75f3a1932002ea10f28c.txt\",\"urlList\":$URLS}"
          cat /tmp/indexnow.out || true
