name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Submit all sitemap URLs
        type: boolean
        default: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for GitHub Pages deploy
        run: sleep 120

      - name: Submit URLs to IndexNow
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            URLS=$(curl -s https://baripas.github.io/sitemap.xml | python3 .github/scripts/indexnow_urls.py sitemap)
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E '\.html$' || true)
            if [ -z "$CHANGED" ]; then echo "No HTML changes; skipping"; exit 0; fi
            URLS=$(printf '%s\n' "$CHANGED" | python3 .github/scripts/indexnow_urls.py changed)
          fi
          echo "Submitting: $URLS"
          curl -s -o /tmp/indexnow.out -w "indexnow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"baripas.github.io\",\"key\":\"34a24b08cb9e75f3a1932002ea10f28c\",\"keyLocation\":\"https://baripas.github.io/34a24b08cb9e75f3a1932002ea10f28c.txt\",\"urlList\":$URLS}"
          cat /tmp/indexnow.out || true
